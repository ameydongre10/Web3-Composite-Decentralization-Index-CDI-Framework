services:
  - type: web
    name: cdi-platform
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cdi-postgres
          property: connectionString
      - key: ETHEREUM_RPC_URL
        value: https://cloudflare-eth.com

databases:
  - name: cdi-postgres
    plan: free
    region: oregon
    databaseName: cdi_db
    user: cdi_user
